AWSTemplateFormatVersion: "2010-09-09"
Description: >
  claude-whatsapp backups: a versioned, encrypted S3 bucket and an IAM user that
  can only sync into its local/ prefix. Deployed by backup/setup.sh.

Parameters:
  NoncurrentVersionDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: Days to keep a file's previous versions after it changes or is deleted.

Resources:
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "claude-whatsapp-backup-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref NoncurrentVersionDays
            ExpiredObjectDeleteMarker: true
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt BackupBucket.Arn
              - !Sub "${BackupBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # Can add, overwrite and delete current files (a delete only adds a delete
  # marker), but cannot remove versions or change the bucket, so a leaked key
  # can't destroy the history.
  BackupUser:
    Type: AWS::IAM::User
    Properties:
      Path: /backup/
      Policies:
        - PolicyName: sync-local-prefix
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListLocalPrefix
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                Resource: !GetAtt BackupBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - local
                      - local/*
              - Sid: ReadWriteLocalPrefix
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${BackupBucket.Arn}/local/*"

Outputs:
  BucketName:
    Value: !Ref BackupBucket
  UserName:
    Value: !Ref BackupUser
