# Everything personal lives in LOCAL_DIR (default ../local, a sibling of this repo).
# Override with `LOCAL_DIR=/path docker compose ...` or a gitignored repo/.env file.
name: claude-whatsapp

services:
  claude:
    build:
      context: .
      dockerfile: claude/Dockerfile
      additional_contexts:
        local: ${LOCAL_DIR:-../local}/config
    image: claude-whatsapp:latest
    container_name: claude-whatsapp
    hostname: claude-whatsapp
    restart: unless-stopped
    init: false            # tini is the image entrypoint
    env_file:
      - path: ${LOCAL_DIR:-../local}/.env
        required: false
    environment:
      DISABLE_AUTOUPDATER: "1"   # update Claude by rebuilding the image
    volumes:
      - ${LOCAL_DIR:-../local}/config:/config
      - ${LOCAL_DIR:-../local}/data/claude:/home/claude/.claude
      - ${LOCAL_DIR:-../local}/data/whatsapp:/home/claude/.whatsapp-channel
      - ${LOCAL_DIR:-../local}/workspace:/workspace
    networks: [agents]

  # --- A real Chrome, viewable in a browser at https://localhost:3001 and driven
  # by Claude through the Claude in Chrome extension (signed in to the same
  # claude.ai account; see README "Chrome").
  chrome:
    build:
      context: chrome
    image: claude-whatsapp-chrome:latest
    container_name: claude-whatsapp-chrome
    hostname: claude-chrome
    restart: unless-stopped
    shm_size: 1gb
    security_opt: [seccomp:unconfined]
    env_file:   # its own file, so Chrome never sees the secrets in .env
      - path: ${LOCAL_DIR:-../local}/chrome.env
        required: false
    environment:
      PUID: "1000"
      PGID: "1000"
    ports:
      - 127.0.0.1:${CHROME_PORT:-3001}:3001   # HTTPS web desktop, this Mac only
    volumes:
      - ${LOCAL_DIR:-../local}/data/chrome:/config
    networks: [agents]

networks:
  agents: {}
