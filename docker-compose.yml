# Everything personal lives in LOCAL_DIR (default ../local, a sibling of this repo).
# Override with `LOCAL_DIR=/path docker compose ...` or a gitignored repo/.env file.
name: claude-whatsapp

services:
  claude:
    build:
      context: .
      dockerfile: claude/Dockerfile
      additional_contexts:
        local: ${LOCAL_DIR:-../local}/config
    image: claude-whatsapp:latest
    container_name: claude-whatsapp
    hostname: claude-whatsapp
    restart: unless-stopped
    init: false            # tini is the image entrypoint
    env_file:
      - path: ${LOCAL_DIR:-../local}/.env
        required: false
    environment:
      DISABLE_AUTOUPDATER: "1"   # update Claude by rebuilding the image
      GOOGLE_WORKSPACE_CLI_KEYRING_BACKEND: file   # no OS keyring in a container
    volumes:
      - ${LOCAL_DIR:-../local}/config:/config
      - ${LOCAL_DIR:-../local}/data/claude:/home/claude/.claude
      - ${LOCAL_DIR:-../local}/data/whatsapp:/home/claude/.whatsapp-channel
      - ${LOCAL_DIR:-../local}/data/gws:/home/claude/.config/gws   # Google Workspace CLI login
      - ${LOCAL_DIR:-../local}/workspace:/workspace
    networks: [agents]

  # --- Camoufox (anti-detect Firefox) on a web desktop at https://localhost:3002,
  # driven by Claude through Playwright MCP at http://camoufox:8931/mcp on the
  # private network (see README "Browser").
  camoufox:
    build:
      context: camoufox
    image: claude-whatsapp-camoufox:latest
    container_name: claude-whatsapp-camoufox
    hostname: camoufox
    restart: unless-stopped
    shm_size: 1gb
    security_opt: [seccomp:unconfined]
    env_file:   # its own file, so the browser never sees the secrets in .env
      - path: ${LOCAL_DIR:-../local}/camoufox.env
        required: false
    environment:
      PUID: "1000"
      PGID: "1000"
    ports:
      - 127.0.0.1:${BROWSER_PORT:-3002}:3001   # HTTPS web desktop, this Mac only
    volumes:
      - ${LOCAL_DIR:-../local}/data/camoufox:/config
    networks: [agents]

networks:
  agents: {}
